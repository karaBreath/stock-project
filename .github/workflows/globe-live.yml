# พิสูจน์ว่าลูกโลกใช้งานได้จริงและ "ครอบคลุมจริง" — รันโค้ดจริงยิง GDELT จริง
# เกณฑ์ (ต้องผ่านทุกข้อ):
#   1) เปิดหน้าต้องไม่ค้าง — ตอบภายใน 1 วินาทีเสมอ แม้ตอนคลังยังว่าง
#   2) ตัวเก็บเบื้องหลังต้องเก็บให้ครอบคลุมหลายคำ ไม่ใช่กระจุกอยู่ 3 เรื่อง
#   3) ต้องวาดจุดได้เยอะพอ และรายงานได้ว่าจุดไหนรู้ที่เกิดเหตุจากพาดหัวจริง
name: globe-live

on:
  push:
    paths:
      - "services/gdelt.py"
      - "services/country_geo.py"
      - "config.py"
      - ".github/workflows/globe-live.yml"
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 14        # ห้ามค้างไม่รู้จบ (เจอจริง: รอบก่อนค้าง 24 นาที)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q requests python-dotenv flask
      - name: เปิดหน้าจริง + ปล่อยตัวเก็บเบื้องหลังทำงาน แล้ววัดความครอบคลุม
        env:
          LEARN_AUTO: "0"
          DB_PATH: /tmp/globe_live.db
        run: |
          # -u = ไม่บัฟเฟอร์ผลลัพธ์ · faulthandler จะพิมพ์ stack ตอนค้างให้เห็นว่าค้างที่บรรทัดไหน
          python -u - <<'PY'
          import faulthandler, time
          faulthandler.dump_traceback_later(660, exit=True)
          from database import init_db
          init_db()
          from services import gdelt

          print("===== 1) เปิดหน้าลูกโลก 5 ครั้ง — ต้องตอบเร็วทุกครั้ง =====")
          slowest = 0.0
          for i in range(1, 6):
              t0 = time.time()
              res = gdelt.all_theme_points("24h")
              el = time.time() - t0
              slowest = max(slowest, el)
              print(f"  ครั้งที่ {i}: {el:.2f}s | จุด={len(res.get('points') or [])} "
                    f"| ข่าวในคลัง={res.get('pool_size')} | กำลังเก็บ={res.get('filling')}")
              time.sleep(3)
          fast_ok = slowest < 1.0
          print(f"  ช้าที่สุด {slowest:.2f}s -> {'ผ่าน' if fast_ok else 'ไม่ผ่าน'}")

          print()
          print("===== 2) รอตัวเก็บเบื้องหลัง (ดูคลังและความครอบคลุมโตขึ้น) =====")
          start = time.time()
          while time.time() - start < 330:
              time.sleep(20)
              res = gdelt.all_theme_points("24h")
              st = res.get("filler") or {}
              print(f"  +{int(time.time()-start):>3}s | ข่าว={res.get('pool_size'):<4}"
                    f" คำที่เก็บได้={len(gdelt.pool_words()):<3}"
                    f" จุด={len(res.get('points') or []):<3}"
                    f" ยิงไป={st.get('tried')} สำเร็จ={st.get('ok')}")
              if not res.get("filling"):
                  break

          final = gdelt.all_theme_points("24h")
          pts = final.get("points") or []
          words = gdelt.pool_words()

          print()
          print("===== ธีม =====")
          for t in final.get("themes", []):
              print(f"  {t['key']:<10} จุด={t['count']:<3} ข่าว={t['articles']}")

          print()
          print(f"===== คำที่เก็บข่าวได้ ({len(words)} คำ) =====")
          print("  " + ", ".join(sorted(words)))

          exact = sum(p.get("exact", 0) for p in pts)
          total = sum(p["count"] for p in pts)
          print()
          print("===== จุดบนลูกโลก (เรียงตามจำนวนข่าว) =====")
          for p in sorted(pts, key=lambda x: -x["count"])[:25]:
              print(f"  {p['name']:<22} {p['theme']:<10} ข่าว={p['count']:<3} "
                    f"รู้ที่เกิดเหตุจากพาดหัว={p.get('exact')}")
          print(f"  รวม {len(pts)} จุด · {total} ข่าว "
                f"· รู้ที่เกิดเหตุจริง {exact} ข่าว ({(100*exact//total) if total else 0}%)")

          names = {p["name"] for p in pts}
          hot = [n for n in ("Iran", "Israel", "Strait of Hormuz", "Red Sea",
                             "Taiwan", "Taiwan Strait", "Ukraine", "Russia",
                             "Gaza", "China", "United States", "Wall Street")
                 if n in names]
          print(f"  จุดร้อนของโลกที่จับได้รอบนี้: {', '.join(hot) or '(ไม่มี)'}")

          cover_ok = len(words) >= 8
          points_ok = len(pts) >= 25
          print()
          print("===== สรุป =====")
          print(f"  เปิดหน้าไม่ค้าง (< 1.00s)        : {'PASS' if fast_ok else 'FAIL'} ({slowest:.2f}s)")
          print(f"  ครอบคลุมหลายคำ (>= 8 คำ)        : {'PASS' if cover_ok else 'FAIL'} ({len(words)} คำ)")
          print(f"  วาดจุดได้เยอะพอ (>= 25 จุด)      : {'PASS' if points_ok else 'FAIL'} ({len(pts)} จุด)")
          ok = fast_ok and cover_ok and points_ok
          print("PASS - ลูกโลกใช้งานได้จริงและครอบคลุมจริง" if ok else "FAIL - ยังไม่ผ่านเกณฑ์")
          PY
