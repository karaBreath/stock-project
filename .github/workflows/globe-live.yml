# พิสูจน์ว่าลูกโลกใช้งานได้จริง — รันโค้ดจริงยิง GDELT จริง แล้วนับจุดที่ได้
# รันซ้ำ 3 รอบห่างกัน เพื่อดูว่าเสถียรจริงไม่ใช่ฟลุ๊ก
name: globe-live

on:
  push:
    paths:
      - "services/gdelt.py"
      - "services/country_geo.py"
      - "config.py"
      - ".github/workflows/globe-live.yml"
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q requests python-dotenv flask
      - name: ยิง GDELT จริง 3 รอบ แล้วนับจุดบนลูกโลก
        env:
          LEARN_AUTO: "0"
          DB_PATH: /tmp/globe_live.db
        run: |
          python - <<'PY'
          import time
          from database import init_db
          init_db()
          from services import gdelt

          ok_rounds = 0
          for i in range(1, 4):
              t0 = time.time()
              res = gdelt.all_theme_points("24h")
              el = round(time.time() - t0, 1)
              pts = res.get("points") or []
              filled = [t for t in res.get("themes", []) if t.get("count")]
              print(f"--- รอบ {i}: {el}s | ok={res.get('ok')} | จุด={len(pts)} "
                    f"| ธีมที่มีข้อมูล={len(filled)}/{len(res.get('themes', []))} "
                    f"| ข่าวที่อ่าน={res.get('articles_seen')} "
                    f"| แยกธีมไม่ได้={res.get('unclassified')}")
              if res.get("error"):
                  print(f"    error: {res['error']}")
              if res.get("note"):
                  print(f"    note: {res['note']}")
              for t in res.get("themes", []):
                  print(f"      {t['key']:<10} จุด={t['count']:<3} ข่าว={t.get('articles', 0)}")
              top = sorted(pts, key=lambda p: -p["count"])[:6]
              for p in top:
                  print(f"      TOP {p['name']:<18} {p['theme']:<10} {p['count']} ข่าว")
              if pts:
                  ok_rounds += 1
              # รอบ 2-3 ล้าง cache เพื่อบังคับให้ยิงใหม่จริง (พิสูจน์ว่าไม่ได้อาศัย cache)
              if i < 3:
                  from database import execute
                  execute("DELETE FROM cache WHERE key LIKE 'gdelt:snap:%'")
                  time.sleep(20)

          print()
          print(f"===== สรุป: รอบที่ได้จุดบนลูกโลก {ok_rounds}/3 =====")
          print("PASS" if ok_rounds >= 2 else "FAIL - ลูกโลกยังไม่เสถียร")
          PY
