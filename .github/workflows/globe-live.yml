# หาเงื่อนไขที่ GDELT ArtList ยอมรับจริง — ตัวแปรที่สงสัย: maxrecords และความกว้างของ query
# วัดก่อนแก้ ไม่เดา
name: globe-live

on:
  push:
    paths:
      - "services/gdelt.py"
      - "services/country_geo.py"
      - "config.py"
      - ".github/workflows/globe-live.yml"
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: วัดว่า ArtList รับ maxrecords / query แบบไหนได้
        run: |
          UA="NEBULA-Stock-App/1.0 (educational stock research)"
          B="https://api.gdeltproject.org/api/v2/doc/doc"
          probe () {
            printf '%-46s' "$1"
            out=$(curl -sS -m 45 -A "$UA" -w '|HTTP=%{http_code}|T=%{time_total}s|SZ=%{size_download}' "$2" 2>&1)
            code=$(echo "$out" | grep -o 'HTTP=[0-9]*' | tail -1)
            tim=$(echo "$out" | grep -o 'T=[0-9.]*s' | tail -1)
            sz=$(echo "$out" | grep -o 'SZ=[0-9]*' | tail -1)
            n=$(echo "$out" | grep -o '"url"' | wc -l)
            echo " $code $tim $sz | ข่าวที่ได้=$n"
            sleep 10
          }
          echo "===== A) คำเดียว เปลี่ยน maxrecords ====="
          probe "inflation maxrecords=5"    "$B?query=inflation&mode=ArtList&format=json&maxrecords=5&timespan=24h"
          probe "inflation maxrecords=50"   "$B?query=inflation&mode=ArtList&format=json&maxrecords=50&timespan=24h"
          probe "inflation maxrecords=100"  "$B?query=inflation&mode=ArtList&format=json&maxrecords=100&timespan=24h"
          probe "inflation maxrecords=250"  "$B?query=inflation&mode=ArtList&format=json&maxrecords=250&timespan=24h"

          echo
          echo "===== B) หลายคำ OR เปลี่ยน maxrecords ====="
          Q3="%28inflation%20OR%20tariff%20OR%20semiconductor%29"
          probe "3 คำ OR maxrecords=5"      "$B?query=$Q3&mode=ArtList&format=json&maxrecords=5&timespan=24h"
          probe "3 คำ OR maxrecords=50"     "$B?query=$Q3&mode=ArtList&format=json&maxrecords=50&timespan=24h"
          probe "3 คำ OR maxrecords=250"    "$B?query=$Q3&mode=ArtList&format=json&maxrecords=250&timespan=24h"

          echo
          echo "===== C) query รวม 9 ธีมของเรา ====="
          Q9="%28%22stock%20market%22%20OR%20inflation%20OR%20tariff%20OR%20semiconductor%20OR%20%22oil%20price%22%20OR%20war%20OR%20earthquake%20OR%20earnings%20OR%20Thailand%29"
          probe "9 ธีม maxrecords=5"        "$B?query=$Q9&mode=ArtList&format=json&maxrecords=5&timespan=24h"
          probe "9 ธีม maxrecords=50"       "$B?query=$Q9&mode=ArtList&format=json&maxrecords=50&timespan=24h"
          probe "9 ธีม maxrecords=250"      "$B?query=$Q9&mode=ArtList&format=json&maxrecords=250&timespan=24h"

          echo
          echo "===== D) ไม่ระบุ maxrecords / ไม่ระบุ sort ====="
          probe "inflation ไม่ระบุ maxrecords" "$B?query=inflation&mode=ArtList&format=json&timespan=24h"
          probe "inflation + sort=DateDesc"    "$B?query=inflation&mode=ArtList&format=json&maxrecords=50&timespan=24h&sort=DateDesc"

          echo
          echo "===== E) ยิงคำเดียว maxrecords=50 ซ้ำ 4 ครั้งห่าง 10 วิ (วัดความเสถียร) ====="
          for w in economy market trade energy; do
            probe "ซ้ำ: $w maxrecords=50" "$B?query=$w&mode=ArtList&format=json&maxrecords=50&timespan=24h"
          done
