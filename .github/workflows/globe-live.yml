# พิสูจน์ว่าลูกโลกใช้งานได้จริง — รันโค้ดจริงยิง GDELT จริง
# จำลองการเปิดหน้า 6 ครั้ง (แต่ละครั้งยิง 1 คำ) แล้วดูว่าคลังโตขึ้นและมีจุดวาดจริงไหม
name: globe-live

on:
  push:
    paths:
      - "services/gdelt.py"
      - "services/country_geo.py"
      - "config.py"
      - ".github/workflows/globe-live.yml"
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q requests python-dotenv flask
      - name: จำลองเปิดหน้าลูกโลก 6 ครั้ง แล้ววัดผลจริง
        env:
          LEARN_AUTO: "0"
          DB_PATH: /tmp/globe_live.db
        run: |
          python - <<'PY'
          import time
          from database import init_db
          init_db()
          from services import gdelt

          rounds_with_points = 0
          for i in range(1, 7):
              t0 = time.time()
              res = gdelt.all_theme_points("24h")
              el = round(time.time() - t0, 1)
              pts = res.get("points") or []
              filled = [t for t in res.get("themes", []) if t.get("count")]
              print(f"เปิดหน้าครั้งที่ {i}: {el}s | จุดบนลูกโลก={len(pts)} "
                    f"| ธีมที่มีข้อมูล={len(filled)}/9 | ข่าวในคลัง={res.get('pool_size')}")
              if res.get("error"):
                  print(f"    error: {res['error']}")
              if res.get("note"):
                  print(f"    note: {res['note']}")
              if pts:
                  rounds_with_points += 1
                  top = sorted(pts, key=lambda p: -p["count"])[:4]
                  print("    " + " | ".join(
                      f"{p['name']}/{p['theme']}={p['count']}" for p in top))
              time.sleep(12)

          print()
          print("===== รายละเอียดธีมหลังเปิด 6 ครั้ง =====")
          final = gdelt.world_snapshot("24h", refill=False)
          for t in final.get("themes", []):
              print(f"  {t['key']:<10} จุด={t['count']:<3} ข่าว={t['articles']}")
          print(f"  ข่าวในคลังทั้งหมด: {final.get('pool_size')} "
                f"| แยกธีมไม่ได้: {final.get('unclassified')}")

          print()
          print(f"===== สรุป: ครั้งที่ลูกโลกมีจุดวาด {rounds_with_points}/6 =====")
          ok = rounds_with_points >= 5 and len(final.get("points") or []) >= 10
          print("PASS - ลูกโลกใช้งานได้จริง" if ok else "FAIL - ยังไม่ผ่านเกณฑ์")
          PY
