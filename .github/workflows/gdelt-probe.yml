# ตรวจ GDELT ตรง ๆ จากเครื่อง GitHub — ดูว่า endpoint/พารามิเตอร์ไหนใช้ได้จริง
name: gdelt-probe

on:
  push:
    paths: [".github/workflows/gdelt-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Probe GDELT (รอบ 3 — ยิงทีละช่วง 90 วันย้อนหลัง)
        run: |
          UA="NEBULA-Stock-App/1.0 (educational stock research)"
          B="https://api.gdeltproject.org/api/v2/doc/doc"
          probe () {
            echo "---------- $1"
            curl -sS -m 60 -A "$UA" -w '\nHTTP=%{http_code} TIME=%{time_total}s SIZE=%{size_download}\n' "$2" 2>&1 | tail -c 300
            echo; sleep 8
          }
          Q="query=inflation&mode=TimelineTone&format=json"
          # ช่วงล่าสุด 90 วัน (ควรได้ 200 อยู่แล้ว)
          probe "chunk 0: ย้อน 0-90 วัน"   "$B?$Q&startdatetime=20260427000000&enddatetime=20260726000000"
          # ย้อนไปอีก 90 วัน — จุดชี้ขาดว่าแบ่งยิงได้ไหม
          probe "chunk 1: ย้อน 90-180 วัน" "$B?$Q&startdatetime=20260127000000&enddatetime=20260427000000"
          probe "chunk 2: ย้อน 180-270 วัน" "$B?$Q&startdatetime=20251029000000&enddatetime=20260127000000"
          probe "chunk 3: ย้อน 270-360 วัน" "$B?$Q&startdatetime=20250731000000&enddatetime=20251029000000"
          # ย้อนไกลมาก — ดูว่าคลังลึกแค่ไหน
          probe "chunk เก่า: ปี 2024"      "$B?$Q&startdatetime=20240101000000&enddatetime=20240331000000"
          probe "chunk เก่ามาก: ปี 2018"   "$B?$Q&startdatetime=20180101000000&enddatetime=20180331000000"
          # ปริมาณข่าว (TimelineVol) แบ่งช่วงได้ไหม
          probe "VOL ย้อน 90-180 วัน"      "$B?query=inflation&mode=TimelineVol&format=json&startdatetime=20260127000000&enddatetime=20260427000000"
          # query ธีมจริงของเรา แบ่งช่วงได้ไหม
          probe "ธีมจริง ย้อน 90-180 วัน"  "$B?query=%28war%20OR%20conflict%20OR%20invasion%29&mode=TimelineTone&format=json&startdatetime=20260127000000&enddatetime=20260427000000"
