# ตรวจ GDELT ตรง ๆ จากเครื่อง GitHub — ดูว่า endpoint/พารามิเตอร์ไหนใช้ได้จริง
name: gdelt-probe

on:
  push:
    paths: [".github/workflows/gdelt-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Probe GDELT (round 2 — เว้นจังหวะ 6 วิ กัน rate limit)
        run: |
          UA="NEBULA-Stock-App/1.0 (educational stock research)"
          B="https://api.gdeltproject.org/api/v2"
          probe () {
            name="$1"; url="$2"
            echo "---------- $name"
            curl -sS -m 60 -A "$UA" -w '\nHTTP=%{http_code} TIME=%{time_total}s SIZE=%{size_download}\n' "$url" 2>&1 | tail -c 260
            echo; sleep 6
          }
          # 1) GEO endpoint ยังมีอยู่ไหม (404 ทุกแบบในรอบแรก)
          probe "GEO bare"        "$B/geo/geo"
          probe "GEO simple"      "$B/geo/geo?query=protest&format=GeoJSON&mode=PointData&timespan=24h"
          probe "GEO html mode"   "$B/geo/geo?query=protest&format=html&mode=PointData&timespan=24h"
          # 2) ArtList — คำเดียว vs วลีมีเครื่องหมายคำพูด
          probe "ART single word" "$B/doc/doc?query=inflation&mode=ArtList&format=json&maxrecords=5&timespan=24h"
          probe "ART quoted"      "$B/doc/doc?query=%22stock%20market%22&mode=ArtList&format=json&maxrecords=5&timespan=24h"
          # 3) หาเพดาน timespan ที่แท้จริง
          probe "TONE 100d"       "$B/doc/doc?query=inflation&mode=TimelineTone&format=json&timespan=100d"
          probe "TONE 120d"       "$B/doc/doc?query=inflation&mode=TimelineTone&format=json&timespan=120d"
          # 4) query จริงของธีมเรา (ซับซ้อน มี OR หลายตัว) ใช้ได้ไหม
          probe "TONE theme 90d"  "$B/doc/doc?query=%28war%20OR%20conflict%20OR%20airstrike%20OR%20invasion%20OR%20ceasefire%29&mode=TimelineTone&format=json&timespan=90d"
          probe "VOL theme 90d"   "$B/doc/doc?query=%28war%20OR%20conflict%20OR%20airstrike%20OR%20invasion%20OR%20ceasefire%29&mode=TimelineVol&format=json&timespan=90d"
          probe "ART theme 24h"   "$B/doc/doc?query=%28war%20OR%20conflict%20OR%20airstrike%20OR%20invasion%20OR%20ceasefire%29&mode=ArtList&format=json&maxrecords=5&timespan=24h"
