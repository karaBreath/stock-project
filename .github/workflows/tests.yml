name: tests

# รันทุกครั้งที่ push หรือเปิด PR — ดูผลได้จากแอป GitHub บนไอแพด
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ติดตั้ง dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: รันชุดทดสอบ (ไม่ต้องต่อเน็ตภายนอก)
        run: python -m pytest tests/ -v
