<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050510" />
  <title>Mr.ARM · STOCK SEEKER</title>

  <!-- PWA: ติดตั้งเป็นแอปบนหน้าจอได้ (Add to Home Screen) -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mr.ARM" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <!-- พื้นหลังอวกาศ -->
  <div class="stars" id="stars"></div>
  <div class="aurora"></div>

  <!-- Sidebar (desktop/tablet) -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark">◆</span>
      <div>
        <div class="logo-text">Mr.ARM</div>
        <div class="logo-sub">STOCK SEEKER</div>
      </div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="sidebar-foot">
      <div class="ai-badge" id="aiModeBadge">AI: rule-based</div>
      <div class="muted small">ข้อมูลเพื่อการศึกษา · ไม่ใช่คำแนะนำการลงทุน</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar glass">
      <div class="search-wrap">
        <span class="search-ic">⌕</span>
        <input id="globalSearch" type="text" placeholder="ค้นหาหุ้น เช่น PTT.BK, AAPL …" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" data-go="report">รายงานวันนี้</button>
        <div class="clock" id="clock"></div>
      </div>
    </header>

    <div id="app" class="views"></div>
  </main>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav glass" id="bottomNav"></nav>

  <!-- toast -->
  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/chart-view.js') }}"></script>
  <script src="{{ url_for('static', filename='js/globe-view.js') }}"></script>
  <script src="{{ url_for('static', filename='js/crisis-view.js') }}"></script>
  <script src="{{ url_for('static', filename='js/lab-view.js') }}"></script>
  <script>
    // ลงทะเบียน service worker (ให้เปิดแอปตอนออฟไลน์แล้วยังเห็นหน้าเดิม)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
