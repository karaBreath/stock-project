# Render Blueprint — deploy ฟรีแบบไม่ต้องใส่บัตรเครดิต
# วิธีใช้: render.com -> New -> Blueprint -> เลือก repo นี้ + branch นี้ -> Apply
services:
  - type: web
    name: mr-arm-stock
    runtime: python
    plan: free
    branch: claude/stock-trading-project-zjrrcz
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -k gthread -w 1 --threads 8 -t 300 -b 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
